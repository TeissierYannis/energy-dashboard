spring:
  application.name: energy-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/energy
    username: energy
    password: energy
  jpa:
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"

providers:
  rte:
    base-url: http://localhost:18080   # on stub en dev (WireMock dans le test ou mini stub dev ci-dessous)
app:
  alert:
    threshold-mw: 50000
    hysteresis-mw: 2000
  dev-polling:
    enabled: true
